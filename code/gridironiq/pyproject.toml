[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: Depends()/Query() in defaults is the documented FastAPI idiom, not a mutable-default bug.
# UP042: PlayType intentionally subclasses str so it serializes to JSON without a custom encoder.
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
# main.py embeds the UI template as a string literal; wrapping it would corrupt the markup.
"app/main.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
